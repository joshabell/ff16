# Tests the scoreboard on every pull request, and deploys it to Cloudflare
# whenever a change to it lands on main. See tech/scoreboard/README.md.
name: Scoreboard

on:
  pull_request:
    paths: ['tech/scoreboard/**', '.github/workflows/scoreboard.yml']
  push:
    branches: [main]
    paths: ['tech/scoreboard/**', '.github/workflows/scoreboard.yml']
  workflow_dispatch: # adds a manual "Run workflow" button on the Actions tab

defaults:
  run:
    working-directory: tech/scoreboard

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tech/scoreboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test # scoring rules, incl. the Notice of Race "Alex = 107" example

  deploy:
    needs: test # never deploy if the tests fail
    # Only from main, and only once Cloudflare is set up (README step 5 sets this variable).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.SCOREBOARD_DEPLOY == 'true'
    runs-on: ubuntu-latest
    concurrency: scoreboard-deploy # one deploy at a time
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tech/scoreboard/package-lock.json
      - run: npm ci
      - run: npx wrangler d1 migrations apply ff16-scoreboard --remote
      - run: npx wrangler deploy
